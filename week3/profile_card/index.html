<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>

<body>

    <div class="card">

        <h1>My Profile</h1>

        <h2 id="name">Sampanna Pandey</h2>

        <p><b>Address:</b></p>
        <p id="address">YOUR FULL ADDRESS HERE</p>

        <p><b>Phone:</b> 98XXXXXXXX</p>

        <p><b>Email:</b> your@email.com</p>

        <button onclick="showQR()">Show QR</button>

    </div>


    <div id="qrBox">

        <div class="qr-card">

            <h2>My QR Code</h2>

            <div id="qrcode"></div>

            <button onclick="closeQR()">Close QR</button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
